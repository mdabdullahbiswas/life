<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<script src="lang.js"></script><script src="dialog.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কাজ · Hayat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* প্যালেট: সোনালি মূল রঙ (#B8892B → #E2C275, ডার্কে #E0B84F → #F2D88A) · ব্রোঞ্জ #8A6420 · এসপ্রেসো #2B2118 · ক্রিম #FBF7EE · উষ্ণ কালো #0C0A07 */
:root{--a:#B8892B;--a2:#E2C275;--g:#8A6420;--p:#7A5614;--on:#1F1608;--bb:var(--t);--bt:var(--a2);--bd:var(--a);--bg:#FBF7EE;--c:rgba(255,252,244,.8);--t:#2B2118;--m:#7A6A55;--b:rgba(120,90,30,.15);--cb:rgba(184,137,43,.42);--sh:rgba(184,137,43,.38);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-d="1"]{--bg:#0C0A07;--c:rgba(32,25,14,.72);--t:#F6EDD8;--m:#B3A68B;--b:rgba(224,184,79,.2);--cb:rgba(224,184,79,.34);--a:#E0B84F;--a2:#F2D88A;--g:#A47A20;--p:#F2D88A;--on:#1A1304;--bb:var(--a);--bt:var(--on);--bd:var(--a2);--sh:rgba(224,184,79,.22)}
/* থিম: গোল্ড + এমারেল্ড */
:root[data-t="1"]:not([data-d="1"]){--g:#0D4C3C;--p:#0D4C3C;--t:#10241D;--m:#5E6F66;--bg:#F8F6EC}
:root[data-t="1"][data-d="1"]{--bg:#07100D;--c:rgba(14,59,46,.45);--g:#1F8A68}
/* থিম: গোল্ড + মিডনাইট নেভি */
:root[data-t="2"]:not([data-d="1"]){--g:#16213E;--p:#16213E;--t:#0F172A;--m:#5F6878;--bg:#F7F6F1}
:root[data-t="2"][data-d="1"]{--bg:#0A0F1E;--c:rgba(22,33,62,.6);--g:#2A3B6B}
/* থিম: গোল্ড + বারগান্ডি */
:root[data-t="3"]:not([data-d="1"]){--g:#5B1A2B;--p:#5B1A2B;--t:#2A0F16;--m:#76616A;--bg:#FAF5EF}
:root[data-t="3"][data-d="1"]{--bg:#0E0709;--c:rgba(91,26,43,.42);--g:#8A2D45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Serif Bengali",serif;color:var(--t);background:var(--bg);min-height:100vh;transition:background .4s}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(60% 60% at 30% 30%,color-mix(in srgb,var(--g) 24%,transparent),transparent),radial-gradient(50% 50% at 80% 20%,color-mix(in srgb,var(--a) 16%,transparent),transparent);z-index:-1;animation:fl 14s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(3%,6%) scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bn,button,input,select,h1,h2,h3,label{font-family:"Noto Serif Bengali",Inter,serif}
main{max-width:1080px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(24px,5vw,34px);margin:0;font-weight:700}
.sub{color:var(--m);font-size:14px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--c);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--cb);border-radius:20px;padding:18px;box-shadow:0 12px 32px -14px var(--sh);animation:up .6s both;transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--a),var(--g))}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px -12px var(--sh)}
.wide{grid-column:1/-1}
h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(var(--g),var(--a))}
.big{font-size:clamp(34px,8vw,52px);font-weight:700;letter-spacing:-1px;background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:"Noto Serif Bengali"}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--b)}
.row:last-child{border:0}
.m{color:var(--m);font-size:13px}
button{border:1px solid var(--bd);border-radius:10px;padding:10px 22px;background:var(--bb);color:var(--bt);font-weight:600;letter-spacing:.3px;cursor:pointer;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:background .2s,color .2s,border-color .2s,box-shadow .2s}
button:hover{background:color-mix(in srgb,var(--bb) 86%,var(--bt));box-shadow:0 4px 14px -6px var(--sh)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button.g{background:transparent;color:var(--t);border:1px solid var(--cb);font-weight:500;box-shadow:none}
button.g:hover{background:color-mix(in srgb,var(--a) 12%,transparent);border-color:var(--a)}
.row button:not(.x){padding:6px 14px}
input,select{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:9px 12px;font-size:14px;min-width:0}
input:focus,select:focus{outline:2px solid var(--g)}
.chk{appearance:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--cb);cursor:pointer;display:grid;place-items:center;transition:.2s;padding:0;flex:none}
.chk:checked{background:linear-gradient(135deg,var(--pc,var(--a)),var(--pc2,var(--a2)));border-color:transparent}
.chk[style]{border-color:color-mix(in srgb,var(--pc) 55%,transparent)}
.chk:checked::after{content:"✓";color:var(--on);font-size:14px}
.chk:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--p);font-weight:600}
.bad{background:rgba(220,60,60,.14);color:#d33}
.bar{height:8px;border-radius:9px;background:var(--b);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g));transition:width .6s}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw b{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .2s}
.sw b:hover{transform:scale(1.2)}.sw b.on{border-color:var(--t)}
form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}form input{flex:1 1 110px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
.st div{padding:10px;border-radius:14px;background:var(--b)}
.x{background:none;border:0;box-shadow:none;color:var(--m);padding:4px 8px}
.x:hover{background:none;box-shadow:none;color:#d33}
.x.ed:hover{color:var(--g)}
.ebn{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--a) 14%,transparent);border:1px solid var(--cb);font-size:13px;font-weight:600}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:6px;margin-top:10px}
.dots b{display:grid;place-items:center;height:32px;border-radius:9px;background:var(--b);font-size:12px;font-weight:500;cursor:pointer;transition:.2s}
.dots b:hover{transform:scale(1.1)}
.dots b.on{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on)}

.cd{text-align:center}
.cd h2{justify-content:center}
.cdw{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px 22px;margin:6px 0 4px}
.ring{position:relative;width:138px;height:138px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .tr{fill:none;stroke:var(--b);stroke-width:7}
.ring .pg{fill:none;stroke:url(#rg);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--sh));transition:stroke-dashoffset 1s linear}
.ring .dc{fill:none;stroke:var(--pc);stroke-width:1;stroke-dasharray:1 6;opacity:.45;animation:spin 60s linear infinite;transform-origin:70px 70px}
@keyframes spin{to{transform:rotate(360deg)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rc b{font-size:22px;font-weight:700;font-family:"Noto Serif Bengali";background:linear-gradient(90deg,var(--pc),var(--pc2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
.rc span{font-size:12px;color:var(--m)}
.tiles{display:flex;align-items:center;gap:6px}
.tl{min-width:62px;padding:10px 6px 8px;border-radius:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 20%,transparent),color-mix(in srgb,var(--pc2) 8%,transparent));border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -12px var(--pc)}
.tl b{display:block;font-size:30px;font-weight:700;line-height:1.15;font-family:"Noto Serif Bengali";background:linear-gradient(180deg,var(--pc2),var(--pc));-webkit-background-clip:text;background-clip:text;color:transparent}
.tl small{font-size:11px;color:var(--m)}
.cl{font-size:24px;color:var(--pc);opacity:.7;margin-top:-14px}
.cds{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.cdc{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;color:var(--m);border:1px solid color-mix(in srgb,var(--pc) 40%,transparent);transition:.3s}
.cdc::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--pc2),var(--pc))}
.cdc.past{opacity:.5;text-decoration:line-through;text-decoration-color:var(--b)}
.cdc.on{background:linear-gradient(135deg,var(--pc),var(--pc2));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 6px 14px -6px var(--pc)}
.cdc.on::before{background:#fff}
.cd{border-color:color-mix(in srgb,var(--pc) 50%,transparent);box-shadow:0 12px 32px -14px var(--pc)}
.cd::after{background:linear-gradient(90deg,var(--pc),var(--pc2))}
.cd h2{color:var(--t)}

.warn{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:rgba(220,60,60,.12);border:1px solid rgba(220,60,60,.4);color:#d33;font-size:13px;font-weight:600;line-height:1.6}
.warn b{font-size:18px;letter-spacing:.5px;margin:0 4px}
.okb{margin:10px 0 0;padding:9px 14px;border-radius:14px;background:rgba(31,157,107,.13);border:1px solid rgba(31,157,107,.4);color:#1f9d6b;font-size:13px;font-weight:600}
:root[data-d="1"] .warn{color:#ff8a8a}:root[data-d="1"] .okb{color:#4fd7a0}
.sp{margin-top:16px;text-align:left}
.spt{font-size:12px;font-weight:600;color:var(--m);letter-spacing:.4px;margin:12px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--b)}
.sr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:6px 8px;border-radius:10px;font-size:13px;color:var(--m)}
.sr span:first-child{display:flex;align-items:center;gap:8px;color:var(--t)}
.sr span:first-child::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--b);flex:none}
.sr.on{font-weight:600}
.sr.on.f{background:rgba(220,60,60,.12);color:#d33}.sr.on.f span:first-child::before{background:#d33;box-shadow:0 0 0 4px rgba(220,60,60,.2)}
.sr.on.n{background:rgba(31,157,107,.13);color:#1f9d6b}.sr.on.n span:first-child::before{background:#1f9d6b;box-shadow:0 0 0 4px rgba(31,157,107,.2)}
:root[data-d="1"] .sr.on.f{color:#ff8a8a}:root[data-d="1"] .sr.on.n{color:#4fd7a0}
.ram{border-color:var(--g)}
.tk{padding:9px 0;border-bottom:1px dashed var(--b)}.tk:last-child{border:0}.tk .row{padding:0;border:0}
.sb{margin:8px 0 2px 34px;display:grid;gap:7px}.sb label{display:flex;gap:8px;align-items:center;font-size:13px}
.chk.sm{width:18px;height:18px;border-radius:6px}.chk.sm:checked::after{font-size:11px}
.sbx{flex:1 1 100%}.sbl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.sbl:empty{display:none}
.stc{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 12px;border-radius:99px;font-size:13px;background:color-mix(in srgb,var(--a) 16%,transparent);border:1px solid var(--cb)}
.stc .x{padding:2px 8px}.sba{display:flex;gap:8px}.sba input{flex:1}.sba button{padding:8px 16px}
.dg{display:flex;gap:6px;flex:1 1 230px;min-width:0}.dg select{flex:1 1 0;min-width:0;padding:9px 6px}.dg.tg{flex:1 1 190px}

/* ===== প্রিমিয়াম বাটন ও টিক · প্রতিটি কার্ডের নিজস্ব রং ===== */
.c1{--pc:#0F8A5F;--pc2:#4FD6A1}.c2{--pc:#A8781F;--pc2:#E6C066}.c3{--pc:#C23B58;--pc2:#F58FA6}
.c4{--pc:#4659D6;--pc2:#9AA7FF}.c5{--pc:#8244C9;--pc2:#C7A0F7}.c6{--pc:#0B7F93;--pc2:#5AD0E0}.c7{--pc:#C2571A;--pc2:#F4A66A}
.tbx{flex:1 1 100%}.tbr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tbr input[type=time]{flex:0 1 150px;min-width:0}
.dgr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--b)}.dgr .dl{flex:1 1 190px;min-width:0}.dgr .dl b{display:block;font-size:14px}.dgr .dg.tg{flex:0 1 270px}
.dga{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.dga button{padding:8px 16px;font-size:13px}
.card{--pt:var(--pc)}:root[data-d="1"] .card{--pt:var(--pc2)}
.card{background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 8%,var(--c)),var(--c) 65%);border-color:color-mix(in srgb,var(--pc) 38%,transparent);box-shadow:0 12px 32px -14px color-mix(in srgb,var(--pc) 55%,transparent)}
.card:hover{box-shadow:0 18px 40px -14px color-mix(in srgb,var(--pc) 65%,transparent)}
.card::after{background:linear-gradient(90deg,var(--pc),var(--pc2))}
.card h2::before{background:linear-gradient(var(--pc),var(--pc2))}
.card .pill{background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pt)}
.card .bar i{background:linear-gradient(90deg,var(--pc),var(--pc2));box-shadow:0 0 10px color-mix(in srgb,var(--pc) 60%,transparent)}
.card .st>div{background:color-mix(in srgb,var(--pc) 10%,transparent)}.card .st div div{background:none;padding:0}.card .st b{color:var(--pt)}
.card .spt{color:var(--pt);border-bottom-color:color-mix(in srgb,var(--pc) 28%,transparent)}
.card .sr span:first-child::before{background:var(--pc)}
.card .row,.card .tk{border-bottom-color:color-mix(in srgb,var(--pc) 22%,transparent)}
.card input:focus,.card select:focus{outline-color:var(--pc)}
.card input:not([type=checkbox]):not([type=hidden]),.card select{border-color:color-mix(in srgb,var(--pc) 30%,var(--b));background:color-mix(in srgb,var(--pc) 4%,var(--c));transition:border-color .2s,box-shadow .2s}
.card input:not([type=checkbox]):focus,.card select:focus{border-color:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb,var(--pc) 18%,transparent);outline:0}
.stc{background:color-mix(in srgb,var(--pc) 14%,transparent);border-color:color-mix(in srgb,var(--pc) 40%,transparent)}
/* টিক বক্স */
.chk{width:26px;height:26px;border-radius:9px;border:2px solid color-mix(in srgb,var(--pt,var(--a)) 62%,transparent);background:color-mix(in srgb,var(--pc,var(--a)) 6%,var(--c));box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:transform .18s,box-shadow .25s,background .25s,border-color .25s}
.chk:hover{transform:scale(1.08);border-color:var(--pc,var(--a));box-shadow:0 0 0 4px color-mix(in srgb,var(--pc,var(--a)) 18%,transparent)}
.chk:checked{background:linear-gradient(135deg,var(--pc,var(--a)),var(--pc2,var(--a2)));border-color:transparent;box-shadow:0 6px 14px -5px var(--pc,var(--a)),inset 0 1px 0 rgba(255,255,255,.45);animation:pop .32s}
.chk:checked::after{content:"✓";color:#fff;font-size:15px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.28);animation:tk .26s}
.chk:focus-visible{outline:2px solid var(--pc,var(--a));outline-offset:2px}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes tk{from{transform:scale(0) rotate(-35deg)}to{transform:none}}
/* মূল বাটন */
.card button:not(.x):not(.g){background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--pc),color-mix(in srgb,var(--pc) 55%,var(--pc2)));color:#fff;border:0;border-radius:12px;letter-spacing:.3px;text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:0 9px 18px -9px var(--pc),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.12);transition:transform .18s,box-shadow .25s,filter .25s}
.card button:not(.x):not(.g):hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 14px 22px -10px var(--pc),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.12)}
.card button:not(.x):not(.g):active{transform:translateY(0) scale(.97);filter:brightness(.97)}
.card button:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
.sba button{width:42px;height:42px;padding:0!important;border-radius:50%!important;font-size:20px;line-height:1;display:grid;place-items:center}
/* দ্বিতীয় বাটন (বাতিল, সব বাদ দিন) */
.card button.g{background:transparent;border:1.5px solid color-mix(in srgb,var(--pc) 55%,transparent);color:var(--pt);border-radius:12px;box-shadow:none;transition:background .2s,transform .18s,border-color .2s}
.card button.g:hover{background:color-mix(in srgb,var(--pc) 14%,transparent);border-color:var(--pc);transform:translateY(-1px)}
/* ছোট আইকন বাটন (✎ ✕ ↪) */
.card .x{width:32px;height:32px;padding:0;display:inline-grid;place-items:center;border-radius:50%;font-size:14px;color:var(--m);background:transparent;border:1px solid transparent;box-shadow:none;transition:background .2s,color .2s,border-color .2s,transform .18s}
.card .x:hover{background:color-mix(in srgb,#d33 14%,transparent);color:#d33;border-color:color-mix(in srgb,#d33 32%,transparent);transform:scale(1.08)}
.card .x.ed:hover{background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pt);border-color:color-mix(in srgb,var(--pc) 40%,transparent)}
.stc .x{width:24px;height:24px;font-size:12px}
@media (prefers-reduced-motion:reduce){.chk,.chk::after,.card button{animation:none!important;transition:none!important}}
.tk .row{flex-wrap:wrap}.card button.nx{padding:6px 12px;font-size:12px;margin-left:6px}

/* স্ক্রল মসৃণ রাখতে */
#app.rd .card{animation:none}
.card{backdrop-filter:none;-webkit-backdrop-filter:none}
body::before{will-change:transform;pointer-events:none}
.card:hover{transform:none}
@media (hover:hover){.card:hover{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}

/* ── Refined premium layer ── */
body{font-feature-settings:"tnum" 1,"lnum" 1;line-height:1.55}
body::before{animation:none;height:46vh;background:radial-gradient(55% 70% at 50% 0,color-mix(in srgb,var(--a) 13%,transparent),transparent)}
main{padding:32px 20px 80px}
header{margin-bottom:26px}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.4px;line-height:1.25}
.sub{font-size:14px;margin-top:6px}
.grid{gap:18px}
/* রং সংযত: সোনালি; শুধু বাকি কাজে সতর্কতার লাল */
.c1,.c2,.c4,.c5,.c6,.c7{--pc:var(--a);--pc2:var(--a2)}

</style></head><body><script src="header.js"></script><main id="app"></main>
<script>
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const $=document.getElementById('app'),root=document.documentElement;
let S={theme:0,dark:0,tasks:[],done:{},skip:{},sd:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('dl')||'{}'))}catch(e){}
if(!S.skip||typeof S.skip!=='object')S.skip={};if(!S.sd||typeof S.sd!=='object')S.sd={};
/* শুধু এই পেজের নিজের কী (OWN) লিখি; থিম, ভাষা ইত্যাদি সেটিং সর্বশেষ সংরক্ষিত অবস্থা থেকেই থাকে */
const OWN=['tasks','done','bags','skip','sd','ovFrom'];
const save=()=>{try{let c={};try{c=JSON.parse(localStorage.getItem('dl')||'{}')}catch(e){}if(!c||typeof c!=='object'||Array.isArray(c))c={};OWN.forEach(k=>{if(S[k]!==undefined)c[k]=S[k]});localStorage.setItem('dl',JSON.stringify(c))}catch(e){}};
const ex=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* কাজের সারাংশ নোটিফিকেশন: সেটিং থাকে 'dl'-এর dg={on,am,pm} ও notif-এ (digest.js এগুলোই পড়ে) */
const ld=()=>{try{const o=JSON.parse(localStorage.getItem('dl')||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch(e){return{}}};
const DGV=()=>{const o=ld(),c=o.dg||{};return{on:c.on!==0,am:/^\d\d:\d\d$/.test(c.am)?c.am:'07:00',pm:/^\d\d:\d\d$/.test(c.pm)?c.pm:'22:00',tk:c.tk!==0,lead:(+c.lead>=0&&+c.lead<=120)?+c.lead:0,notif:!!o.notif}};
const setDG=fn=>{const o=ld();fn(o);try{localStorage.setItem('dl',JSON.stringify(o))}catch(e){}try{window.dispatchEvent(new Event('hdg'))}catch(e){}};
const TL=s=>window.L?window.L(s):s;
function dgSel(w,v){return `<input type="time" class="dgt" data-dgt="${w}" value="${v}" aria-label="সময়" style="flex:0 1 150px">`}
function dgCard(){const pushOn=!!(window.hayatPush&&window.hayatPush.on()),c=DGV(),perm=window.Notification?Notification.permission:'unsupported',ok=perm==='granted'&&c.notif;
return `<section class="card wide c7" id="dgc"><h2>নোটিফিকেশন <span class="pill">${c.on&&ok?'চালু':'বন্ধ'}</span></h2>
<div class="m" style="margin-bottom:6px">${perm==='denied'?'ব্রাউজারে নোটিফিকেশন বন্ধ আছে। সাইট সেটিং থেকে অনুমতি দিন।':ok?'নোটিফিকেশন চালু আছে':'নোটিফিকেশন চালু নেই'}</div>
<div class="dgr"><span class="dl"><b>প্রথম সময়</b><span class="m">আজকের কাজের তালিকা</span></span>${dgSel('am',c.am)}</div>
<div class="dgr"><span class="dl"><b>দ্বিতীয় সময়</b><span class="m">আজ এখনো বাকি</span></span>${dgSel('pm',c.pm)}</div>
<div class="dgr"><span class="dl"><b>কাজের সময়ে রিমাইন্ডার</b><span class="m">নির্ধারিত সময়ে নোটিফিকেশন</span></span><span class="dga" style="margin:0"><select data-lead="1" title="কত মিনিট আগে">${opts([[0,'ঠিক সময়ে'],[5,'৫ মিনিট আগে'],[10,'১০ মিনিট আগে'],[15,'১৫ মিনিট আগে'],[30,'৩০ মিনিট আগে']],c.lead)}</select><button type="button" class="g" data-a="dgtk">${c.tk?'চালু':'বন্ধ'}</button></span></div>
<div class="dga">${ok?'':'<button type="button" data-a="dgperm">নোটিফিকেশন চালু করুন</button>'}<button type="button" class="g" data-a="dgon">${c.on?'চালু':'বন্ধ'}</button><button type="button" class="g" data-a="dgtest" data-k="am">প্রথমটি পরীক্ষা</button><button type="button" class="g" data-a="dgtest" data-k="pm">দ্বিতীয়টি পরীক্ষা</button></div>
<div class="dgr" style="margin-top:8px;border-bottom:0"><span class="dl"><b>পুশ নোটিফিকেশন</b><span class="m">${pushOn?'পুশ চালু আছে':'পুশ চালু নেই'}</span></span><span class="dga" style="margin:0">${pushOn?'<button type="button" class="g" data-a="pushtest" data-k="am">পুশ পরীক্ষা</button><button type="button" class="g" data-a="pushoff">পুশ বন্ধ করুন</button>':'<button type="button" data-a="pushon">এই ডিভাইসে পুশ চালু করুন</button>'}</span></div>
<div class="m" style="margin-top:10px;font-size:12px">ঠিক সময়ে পেতে অ্যাপটি Home Screen-এ ইনস্টল করুন।</div></section>`}
function dgChange(el){const w=el.dataset.dg,g=[...document.querySelectorAll('[data-dg="'+w+'"]')],v={};g.forEach(x=>v[x.dataset.p]=x.value);
const h=(+v.h%12)+(v.p==='PM'?12:0),val=String(h).padStart(2,'0')+':'+String(+v.m||0).padStart(2,'0');
setDG(o=>{o.dg=Object.assign({},o.dg,{[w]:val})})}
let E=null; /* এডিট করা কাজের id */
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const DAY=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
const MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const lbl=t=>TYL(t);
/* সময় ১২ ঘণ্টায় দেখানো: সংরক্ষণ থাকে ২৪ ঘণ্টার HH:MM-এ, শুধু দেখানো ও বাছাইয়ের ধরন বদলেছে */
const tf=s=>{if(!s)return '';const[h,m]=String(s).split(':').map(Number);if(isNaN(h))return '';return bn(h%12||12)+':'+bn(String(m||0).padStart(2,'0'))+' '+(h>=12?'PM':'AM')};
const opts=(a,sel)=>a.map(([v,l])=>`<option value="${v}"${String(v)===String(sel)?' selected':''}>${l}</option>`).join('');
const dim=(y,m)=>new Date(y,m,0).getDate();
const dayOpts=(y,m,sel)=>opts(Array.from({length:dim(y,m)},(_,i)=>[i+1,bn(i+1)]),sel);
function dateField(v){const val=/^\d{4}-\d\d-\d\d$/.test(v||'')?v:key(new Date());
return `<input type="date" name="date" value="${val}" title="কোন দিনের কাজ" aria-label="তারিখ" required style="flex:1 1 150px;min-width:0">`}
function timeField(v){const val=/^\d{1,2}:\d{2}$/.test(v||'')?v.split(':').map(x=>x.padStart(2,'0')).join(':'):'';
return `<div class="tbx"><div class="m" style="margin-bottom:6px">সময় (ঐচ্ছিক)</div><div class="tbr"><input type="time" name="time" value="${val}" aria-label="সময়"><button type="button" class="x" data-a="tclr" aria-label="সময় মুছুন" title="সময় মুছুন">✕</button></div></div>`}
const dt=t=>bn(+t.start.slice(8))+' '+MON[+t.start.slice(5,7)-1];
function due(t,d){const s=new Date(t.start+'T00:00'),k=Math.round((new Date(key(d)+'T00:00')-s)/864e5);if(k<0)return 0;
const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
return t.type=='once'?k==0:t.type=='daily'||(t.type=='every'&&k%t.n==0)||(t.type=='weekly'&&k%7==0)||(t.type=='monthly'&&Math.min(s.getDate(),dim)==d.getDate())||(t.type=='mevery'&&(t.n||1)>0&&(((d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth())%(t.n||1)==0)&&Math.min(s.getDate(),dim)==d.getDate())||(t.type=='yearly'&&s.getDate()==d.getDate()&&s.getMonth()==d.getMonth())}
const TYL=t=>t.type=='once'?'একবার':t.type=='every'?bn(t.n)+' দিন পর পর':t.type=='mevery'?bn(t.n)+' মাস পর পর':({daily:'প্রতিদিন',weekly:'প্রতি সপ্তাহে',monthly:'প্রতি মাসে',yearly:'প্রতি বছর'})[t.type]||'';
const bp=t=>{const b=t.bag&&(S.bags||[]).find(x=>x.id===t.bag);if(!b)return '';const n=b.it.length,k=b.it.filter(x=>x.k).length;return ' · '+bn(n?Math.round(k/n*100):0)+'% প্যাক হয়েছে'};
const byTime=(a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99');
function streak(now){let n=0;for(let i=0;i<365;i++){const d=new Date(now);d.setDate(d.getDate()-i);const L=S.tasks.filter(t=>due(t,d));
if(!L.length){if(i==0)continue;else break}
const dn=L.filter(t=>(S.done[key(d)]||{})[t.id]).length;if(dn==L.length)n++;else if(i==0)continue;else break}return n}
/* উপকাজ: t.subs=[{id,t}] · তারিখ ধরে অবস্থা S.sd[তারিখ][কাজ id][উপকাজ id] · বাদ দেওয়া বাকি কাজ S.skip[তারিখ][কাজ id] · বাকি গোনা শুরু S.ovFrom */
const chip=(txt,id)=>`<span class="stc"><input type="hidden" name="sub" value="${ex(txt)}"><input type="hidden" name="sid" value="${ex(id||'')}">${ex(txt)}<button type="button" class="x" data-a="subdel" aria-label="সরান" title="সরান">✕</button></span>`;
function addSub(){const i=document.getElementById('subn'),l=document.getElementById('sbl');if(!i||!l)return;const v=i.value.trim();if(!v)return;l.insertAdjacentHTML('beforeend',chip(v,''));i.value='';i.focus()}
const subs=(t,k)=>{const L=t.subs||[];if(!L.length)return '';const dd=((S.sd||{})[k]||{})[t.id]||{};return `<div class="sb">${L.map(s=>`<label style="${dd[s.id]?'color:var(--m)':''}"><input type="checkbox" class="chk sm" data-a="sub" data-i="${t.id}" data-s="${s.id}" data-k="${k}" ${dd[s.id]?'checked':''}><span style="${dd[s.id]?'text-decoration:line-through':''}">${ex(s.t)}</span></label>`).join('')}</div>`};
/* পুনরাবৃত্ত কাজের পরের নির্ধারিত দিন (আজ থেকে গুনে) */
const nxl=t=>{const n=new Date();for(let i=0;i<=800;i++){const d=new Date(n);d.setDate(d.getDate()+i);if(due(t,d))return i==0?'আজ':i==1?'আগামীকাল':bn(d.getDate())+' '+MON[d.getMonth()]}return ''};
const rowT=(t,k,late)=>{const dn_=(S.done[k]||{})[t.id],L=t.subs||[],dd=((S.sd||{})[k]||{})[t.id]||{},sc=L.filter(s=>dd[s.id]).length;
return `<div class="tk"><div class="row"><label style="display:flex;gap:10px;align-items:center;${dn_?'color:var(--m)':''}"><input type="checkbox" class="chk" data-a="task" data-i="${t.id}" data-k="${k}" ${dn_?'checked':''}><span style="${dn_?'text-decoration:line-through':''}">${ex(t.title)}</span></label><span class="m" style="display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end">${[t.time?tf(t.time):'',late&&t.type=='once'?'':lbl(t),L.length?'উপকাজ '+bn(sc)+'/'+bn(L.length):''].filter(Boolean).join(' · ')}${bp(t)}${late?(t.type=='once'?`<button class="x ed" data-a="resched" data-i="${t.id}" aria-label="আজকের কাজে নিন" title="আজকের কাজে নিন">↪</button><button class="x" data-a="skip" data-i="${t.id}" data-k="${k}" aria-label="বাদ দিন" title="বাদ দিন">✕</button>`:(()=>{const nx=nxl(t);return nx?`<button type="button" class="g nx" data-a="nextt" data-i="${t.id}" title="এই কাজের বাকি পড়া সব দিন বাদ দিয়ে পরের বারে যান">পরের বার: ${nx}</button>`:`<button class="x" data-a="skip" data-i="${t.id}" data-k="${k}" aria-label="বাদ দিন" title="বাদ দিন">✕</button>`})()):`<button class="x ed" data-a="edit" data-i="${t.id}" aria-label="এডিট" title="এডিট">✎</button>`}</span></div>${subs(t,k)}</div>`};
/* যে দিন পার হয়ে গেছে অথচ কাজ শেষ হয়নি (একবারের কাজ শুরুর দিন থেকে; পুনরাবৃত্ত কাজ নতুন সংস্করণ চালুর দিন থেকে, সর্বোচ্চ ৩০ দিন) */
function overdue(now){const T=key(now),out=[],dn=S.done||{},sk=S.skip||{};
S.tasks.forEach(t=>{if(!t.start)return;const miss=k=>!(dn[k]||{})[t.id]&&!(sk[k]||{})[t.id];
if(t.type=='once'){if(t.start<T&&miss(t.start))out.push({t,k:t.start});return}
for(let i=1;i<=30;i++){const d=new Date(now);d.setDate(d.getDate()-i);const k=key(d);if(k<S.ovFrom||k<t.start)break;if(due(t,d)&&miss(k))out.push({t,k})}});
return out.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:byTime(a.t,b.t))}
function render(){const sy=window.scrollY,now=new Date(),K=key(now);if(!S.ovFrom){S.ovFrom=K;save()}const et=E!=null?S.tasks.find(t=>t.id==E):null;if(E!=null&&!et)E=null;const fv=et||{title:'',start:key(now),type:'once',n:3,time:'',subs:[]},sel=v=>fv.type==v?' selected':'';root.dataset.t=S.theme||0;root.dataset.d=S.dark||0;
const tt=S.tasks.filter(t=>due(t,now)).sort(byTime),dn=tt.filter(t=>(S.done[K]||{})[t.id]),pct=tt.length?Math.round(dn.length/tt.length*100):0;
const week=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(d.getDate()+i);const L=S.tasks.filter(t=>due(t,d)).sort(byTime);return{d,L}});
const od=overdue(now);let odH='',last='';od.forEach(({t,k})=>{if(k!=last){last=k;const d=new Date(k+'T00:00');odH+=`<div class="spt">${DAY[d.getDay()]} · ${bn(d.getDate())} ${MON[d.getMonth()]} ${bn(d.getFullYear())}</div>`}odH+=rowT(t,k,true)});
$.innerHTML=`<header><div><h1>কাজ</h1><div class="sub">${DAY[now.getDay()]}, ${bn(now.getDate())} ${MON[now.getMonth()]} ${bn(now.getFullYear())}</div></div></header>
<div class="grid"><section class="card wide c1"><h2>আজকের কাজ <span class="pill">${bn(dn.length)}/${bn(tt.length)}</span></h2>
${tt.length?tt.map(t=>rowT(t,K,false)).join(''):'<div class="m">আজ কোনো কাজ নেই।</div>'}
<div class="bar"><i style="width:${pct}%"></i></div>
