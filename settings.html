<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<script src="lang.js"></script>
<script src="sync.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সেটিং · Hayat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#B8892B;--a2:#E2C275;--g:#8A6420;--p:#7A5614;--on:#1F1608;--bg:#FBF7EE;--c:rgba(255,252,244,.82);--t:#2B2118;--m:#7A6A55;--b:rgba(120,90,30,.15);--cb:rgba(184,137,43,.4);--sh:rgba(184,137,43,.38);--ok:#1f9d6b;--er:#d33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-d="1"]{--bg:#0C0A07;--c:rgba(32,25,14,.74);--t:#F6EDD8;--m:#B3A68B;--b:rgba(224,184,79,.2);--cb:rgba(224,184,79,.34);--a:#E0B84F;--a2:#F2D88A;--g:#A47A20;--p:#F2D88A;--sh:rgba(224,184,79,.22);--ok:#4fd7a0;--er:#ff8a8a}
:root[data-t="1"]:not([data-d="1"]){--g:#0D4C3C;--p:#0D4C3C;--t:#10241D;--m:#5E6F66;--bg:#F8F6EC}
:root[data-t="1"][data-d="1"]{--bg:#07100D;--c:rgba(14,59,46,.45);--g:#1F8A68}
:root[data-t="2"]:not([data-d="1"]){--g:#16213E;--p:#16213E;--t:#0F172A;--m:#5F6878;--bg:#F7F6F1}
:root[data-t="2"][data-d="1"]{--bg:#0A0F1E;--c:rgba(22,33,62,.6);--g:#2A3B6B}
:root[data-t="3"]:not([data-d="1"]){--g:#5B1A2B;--p:#5B1A2B;--t:#2A0F16;--m:#76616A;--bg:#FAF5EF}
:root[data-t="3"][data-d="1"]{--bg:#0E0709;--c:rgba(91,26,43,.42);--g:#8A2D45}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Serif Bengali",serif;color:var(--t);background:var(--bg);min-height:100vh;line-height:1.55;transition:background .4s}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(60% 60% at 30% 30%,color-mix(in srgb,var(--g) 11%,transparent),transparent),radial-gradient(50% 50% at 80% 20%,color-mix(in srgb,var(--a) 7%,transparent),transparent);z-index:-1}
button,input,select,h1,h2{font-family:"Noto Serif Bengali",Inter,serif}
main{max-width:1040px;margin:auto;padding:22px 18px 80px}
.top{margin-bottom:20px}
h1{font-size:clamp(26px,5vw,34px);margin:0;font-weight:700;letter-spacing:-.3px}
.m{color:var(--m);font-size:13px}

/* ডেটা-ভল্ট: পেজের একমাত্র গাঢ় অংশ — থিমের রঙে গাঢ়, সোনালি সূক্ষ্ম বৃত্ত-নকশা */
.vault{position:relative;overflow:hidden;border-radius:22px;padding:26px 26px 24px;margin-bottom:28px;color:#FBF3DC;
background:radial-gradient(120% 140% at 100% 0,rgba(226,194,117,.30),transparent 55%),repeating-radial-gradient(circle at 100% 0,rgba(226,194,117,.11) 0 1px,transparent 1px 24px),linear-gradient(135deg,color-mix(in srgb,var(--g) 60%,#120c05),color-mix(in srgb,var(--g) 38%,#0b0703));
border:1px solid rgba(226,194,117,.5);box-shadow:0 28px 48px -30px rgba(31,22,8,.75),inset 0 1px 0 rgba(255,255,255,.14);animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.vault .hl{font-size:13px;color:rgba(251,243,220,.72);letter-spacing:.3px}
.vault .big{font-size:clamp(28px,6vw,40px);font-weight:700;line-height:1.25;margin:4px 0 16px;background:linear-gradient(90deg,#FFF1C2,#E2C275 60%,#C99A3A);-webkit-background-clip:text;background-clip:text;color:transparent}
.vault .vs,.vault .vs.okb,.vault .vs.warn{display:inline-flex;align-items:center;gap:9px;margin:0;padding:7px 15px;border-radius:99px;font-size:14px;font-weight:500;color:rgba(251,243,220,.92);background:rgba(255,255,255,.08);border:1px solid rgba(226,194,117,.3)}
.vault .vs i{width:8px;height:8px;border-radius:50%;background:#4fd7a0;box-shadow:0 0 0 4px rgba(79,215,160,.2)}
.vault .vs.warn i{background:#ff9a8a;box-shadow:0 0 0 4px rgba(255,138,138,.22)}

/* হোম পেজের সাথে মেলানো সাজ */
.sec>h2::before{content:"";width:8px;height:8px;border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,var(--a2),var(--a));box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent);flex:none}
.top{padding-bottom:16px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,color-mix(in srgb,var(--a) 55%,transparent),transparent 78%) 1}
@media(min-width:700px){main{padding:32px 28px 96px}.cols{gap:0 26px}}
/* ভাগ ও কার্ড */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px;align-items:start}
.col{min-width:0}
.sec{margin-bottom:24px}
.sec>h2{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font-size:14.5px;font-weight:700;color:var(--p);letter-spacing:.2px}
.card{background:var(--c);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--a) 30%,transparent);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03),0 20px 36px -26px var(--sh)}
.pad{padding:16px 18px}.pad>*+*{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;border-bottom:1px solid var(--b)}
.card>.row:last-child{border-bottom:0}
.row>div>b{font-weight:600;font-size:15px}
.hr{gap:10px}.hb{display:flex;align-items:center;gap:8px;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--a) 20%,transparent);color:var(--p);font-weight:600}
.warn,.okb{padding:10px 13px;border-radius:12px;font-size:13px;font-weight:600}
.warn{background:color-mix(in srgb,var(--er) 12%,transparent);border:1px solid color-mix(in srgb,var(--er) 40%,transparent);color:var(--er)}
.okb{background:color-mix(in srgb,var(--ok) 13%,transparent);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}

/* বাটন: সোনালি মূল বাটন, বাকিগুলো রেখার */
button{border:1px solid color-mix(in srgb,var(--a) 65%,#5a3c08);border-radius:12px;padding:10px 18px;background:linear-gradient(135deg,var(--a2),var(--a));color:var(--on);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.45) inset,0 10px 18px -12px var(--sh);transition:filter .2s,transform .12s,background .2s}
button:hover{filter:brightness(1.05)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button.g{background:transparent;color:var(--t);border-color:var(--cb);box-shadow:none;font-weight:600;padding:9px 16px;font-size:13px}
button.g:hover{background:color-mix(in srgb,var(--a) 12%,transparent);filter:none}
button.dg{background:transparent;color:var(--er);border-color:color-mix(in srgb,var(--er) 50%,transparent);box-shadow:none;font-weight:600}
button.dg:hover{background:color-mix(in srgb,var(--er) 10%,transparent);filter:none}
button.sm{padding:4px 11px;min-width:36px;font-size:15px;border-radius:10px}
button:disabled{opacity:.35;pointer-events:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--a) 9%,transparent);border:1px solid var(--b)}
.seg button{flex:1;background:transparent;color:var(--m);border-color:transparent;box-shadow:none;font-weight:600;padding:9px 12px}
.seg button.on{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on);box-shadow:0 6px 14px -8px var(--sh)}

/* থিম বাছাই */
.thm{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
button.tc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;background:transparent;color:var(--m);border:1px solid var(--b);border-radius:14px;font-size:11.5px;font-weight:600;line-height:1.3;text-align:center;box-shadow:none}
button.tc i{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 4px 10px -4px rgba(0,0,0,.4)}
button.tc:hover{filter:none;border-color:var(--cb)}
button.tc.on{border-color:var(--a);color:var(--t);background:color-mix(in srgb,var(--a) 12%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}

/* টগল ও ফিল্ড */
.tgl{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:99px;border:1px solid var(--cb);background:color-mix(in srgb,var(--t) 10%,transparent);position:relative;cursor:pointer;transition:.22s;flex:none;padding:0;margin:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.22s}
.tgl:checked{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent}
.tgl:checked::after{left:21px}
input{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:11px 13px;font-size:14px;min-width:0;width:100%}
select,.tin{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:12px;padding:10px 12px;font-size:14px;font-family:inherit;min-width:0}
.tin{width:auto;flex:none}select:focus,.tin:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent);outline:0}
.row .acts{justify-content:flex-end}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent);outline:0}
form{display:flex;gap:8px;flex-wrap:wrap}
.ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--t);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);z-index:99;animation:rise .3s both}
@media(max-width:820px){.cols{grid-template-columns:1fr}.vault{padding:22px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><script src="header.js"></script>
<main id="app"></main>
<script>
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const TH=[['শ্যাম্পেইন গোল্ড','#8A6420'],['গোল্ড + এমারেল্ড','#0D4C3C'],['গোল্ড + নেভি','#16213E'],['গোল্ড + বারগান্ডি','#5B1A2B']];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
// সব পেজের সাথে একই স্টোরেজ কী ('dl')
let S={theme:0,dark:0,tasks:[],done:{},pr:{},fin:[],url:'',notif:0,qaza:[0,0,0,0,0,0],fast:{},ram:{},rm:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('dl')||'{}'))}catch(e){}
if(!TH[S.theme])S.theme=0;
/* সেটিংসের নিজের মানগুলোই (OWNS) লিখি; লেনদেন, কাজ, নামাজ ইত্যাদি অন্য পেজের ডাটা সর্বশেষ সংরক্ষিত অবস্থা থেকে থাকে — নইলে এই পেজ খোলা অবস্থায় অন্য ট্যাবে যোগ করা তথ্য মুছে যেত। all=true শুধু ব্যাকআপ ফেরানোর সময় */
const OWNS=['theme','dark','lang','rm','notif','home','lastBak'];
const save=all=>{try{if(all){localStorage.setItem('dl',JSON.stringify(S));return}let c={};try{c=JSON.parse(localStorage.getItem('dl')||'{}')}catch(e){}if(!c||typeof c!=='object'||Array.isArray(c))c={};OWNS.forEach(k=>{if(S[k]===undefined)delete c[k];else c[k]=S[k]});localStorage.setItem('dl',JSON.stringify(c))}catch(e){}};
const $=document.getElementById('app'),root=document.documentElement;
let DP=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DP=e;render()});
function toast(m){const e=document.createElement('div');e.className='ts';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
/* ===== নোটিফিকেশন ও সারাংশ: সেটিং থাকে 'dl'-এর dg={on,am,pm,tk,lead} ও notif-এ (digest.js ও সার্ভার এগুলোই পড়ে) ===== */
const ldl=()=>{try{const o=JSON.parse(localStorage.getItem('dl')||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch(e){return{}}};
const DGV=()=>{const o=ldl(),c=o.dg||{};return{on:c.on!==0,am:/^\d\d:\d\d$/.test(c.am)?c.am:'07:00',pm:/^\d\d:\d\d$/.test(c.pm)?c.pm:'22:00',tk:c.tk!==0,lead:(+c.lead>=0&&+c.lead<=120)?+c.lead:0,notif:!!o.notif}};
const setDG=fn=>{const o=ldl();fn(o);try{localStorage.setItem('dl',JSON.stringify(o))}catch(e){}try{window.dispatchEvent(new Event('hdg'))}catch(e){}};
const pushOnNow=()=>!!(window.hayatPush&&window.hayatPush.on());
const tin=(w,v)=>`<input type="time" class="tin" data-dgt="${w}" value="${v}" aria-label="সময়">`;
const lsel=v=>`<select class="tin" data-lead="1" aria-label="কত মিনিট আগে">${[[0,'ঠিক সময়ে'],[5,'৫ মিনিট আগে'],[10,'১০ মিনিট আগে'],[15,'১৫ মিনিট আগে'],[30,'৩০ মিনিট আগে']].map(([x,y])=>`<option value="${x}"${+v===x?' selected':''}>${y}</option>`).join('')}</select>`;
/* ===== রোজার রিমাইন্ডার (সার্ভার থেকে পুশ): সেটিং 'dl'-এর rz-এ; হিজরি মাসের শুরুর তারিখের তালিকা hc-তে ===== */
const RZV=()=>{const z=ldl().rz||{};return{on:+z.on===1,sh:z.sh==null?30:+z.sh,ift:z.ift==null?1:+z.ift,ni:z.ni===''?'':(/^\d\d:\d\d$/.test(z.ni)?z.ni:'21:00'),wk:+z.wk===1}};
const setRZ=fn=>{const o=ldl();o.rz=Object.assign({},o.rz);fn(o.rz);try{localStorage.setItem('dl',JSON.stringify(o))}catch(e){}};
function ensureHC(){try{const HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',year:'numeric'}),o=ldl(),hc=o.hc,t=new Date();t.setHours(12,0,0,0);const far=new Date(t);far.setDate(far.getDate()+500);
if(Array.isArray(hc)&&hc.length>20&&String(hc[hc.length-1][0])>=key(far))return;
const out=[],d=new Date(t);d.setDate(d.getDate()-45);
for(let i=0;i<1150;i++){const f=HF.formatToParts(d),g=q=>+f.find(p=>p.type===q).value;if(g('day')==1)out.push([key(d),g('month')]);d.setDate(d.getDate()+1)}
if(out.length>20){o.hc=out;localStorage.setItem('dl',JSON.stringify(o))}}catch(e){}}
const tg=(a,t,d,on)=>`<div class="row"><div><b>${t}</b>${d?`<div class="m">${d}</div>`:''}</div><input type="checkbox" class="tgl" data-a="${a}" aria-label="${t}" ${on?'checked':''}></div>`;
const HN={cd:['পরবর্তী নামাজের কাউন্টডাউন',''],wx:['আবহাওয়া',''],pr:['আজকের নামাজ',''],rz:['রোজা',''],bal:['ব্যালেন্স',''],tk:['আজকের কাজ','']};
const HD=Object.keys(HN);
const homeOrder=()=>{const o=Array.isArray(S.home&&S.home.order)?S.home.order.filter(k=>HN[k]):[];HD.forEach(k=>{if(!o.includes(k))o.push(k)});return o};
function render(){root.dataset.t=S.theme;root.dataset.d=S.dark;
const days=S.lastBak?Math.floor((Date.now()-S.lastBak)/864e5):-1;
const hsy=window.hayatSync?hayatSync.status():{on:0};const synced=hsy.on&&!hsy.err&&hsy.lastOk&&Date.now()-hsy.lastOk<864e5;
const bs=synced?['শিটে সংরক্ষিত','okb','শেষ সিঙ্ক: '+(Date.now()-hsy.lastOk<6e4?'এইমাত্র':bn(Math.floor((Date.now()-hsy.lastOk)/6e4))+' মিনিট আগে')]:days<0?['ব্যাকআপ নেই','warn','এখনো ব্যাকআপ নেওয়া হয়নি']:days>7?['ব্যাকআপ পুরোনো','warn','শেষ ব্যাকআপ: '+bn(days)+' দিন আগে']:['ব্যাকআপ নিরাপদ','okb','শেষ ব্যাকআপ: '+(days?bn(days)+' দিন আগে':'আজ')];
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const hero=`<section class="vault"><div class="hl">আপনার তথ্য</div><div class="big">${bs[0]}</div><div class="vs ${bs[1]}"><i></i>${bs[2]}</div></section>`;
const look=`<section class="sec"><h2>চেহারা</h2><div class="card">${tg('dark','রাতের মোড','',S.dark)}<div class="pad"><div class="thm">${TH.map((t,i)=>`<button class="tc ${i==S.theme?'on':''}" data-a="th" data-i="${i}"><i style="background:linear-gradient(135deg,${t[1]} 50%,#E0B84F 50%)"></i>${t[0]}</button>`).join('')}</div></div></div></section>`;
const lang=`<section class="sec"><h2>ভাষা</h2><div class="card pad"><div class="seg"><button class="${(S.lang||'bn')=='bn'?'on':''}" data-a="lg" data-i="bn">বাংলা</button><button class="${S.lang=='en'?'on':''}" data-a="lg" data-i="en">English</button></div></div></section>`;
const mode=`<section class="sec"><h2>মোড</h2><div class="card">${tg('rm','রমজান মোড','',S.rm)}</div></section>`;
const dg=DGV(),perm=window.Notification?Notification.permission:'unsupported',nok=perm==='granted'&&dg.notif,pushOn=!!(window.hayatPush&&window.hayatPush.on());
const rz=RZV(),rsel=`<select class="tin" data-rz="sh" aria-label="সেহরির আগে">${[[0,'বন্ধ'],[10,'১০ মিনিট আগে'],[20,'২০ মিনিট আগে'],[30,'৩০ মিনিট আগে'],[45,'৪৫ মিনিট আগে'],[60,'১ ঘণ্টা আগে']].map(([x,y])=>`<option value="${x}"${rz.sh===x?' selected':''}>${y}</option>`).join('')}</select>`;
const rzs=`<section class="sec"><h2>রোজার রিমাইন্ডার ${rz.on&&nok&&pushOn?'<span class="pill">চালু</span>':''}</h2><div class="card">${tg('rzon','রোজার রিমাইন্ডার',pushOn?'সেহরি, ইফতার ও আগের রাতের মনে করানো':'আগে নোটিফিকেশনের পুশ চালু করুন',rz.on)}
