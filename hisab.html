<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<script src="lang.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>হিসাব · Hayat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#B8892B;--a2:#E2C275;--g:#8A6420;--p:#7A5614;--on:#1F1608;--bg:#FBF7EE;--c:rgba(255,252,244,.88);--t:#2B2118;--m:#7A6A55;--b:rgba(120,90,30,.15);--cb:rgba(184,137,43,.4);--sh:rgba(184,137,43,.38);--ok:#1f9d6b;--er:#d33;
--hk:#2A1E0F;--hk2:#4A3516;--ln:rgba(120,90,30,.15);--bb:var(--hk);--bf:#F2D88A;
--sd:0 1px 2px rgba(60,40,10,.06),0 14px 30px -18px var(--sh);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-d="1"]{--bg:#0C0A07;--c:rgba(32,25,14,.8);--t:#F6EDD8;--m:#B3A68B;--b:rgba(224,184,79,.2);--cb:rgba(224,184,79,.34);--a:#E0B84F;--a2:#F2D88A;--g:#A47A20;--p:#F2D88A;--sh:rgba(224,184,79,.22);--ok:#4fd7a0;--er:#ff8a8a;
--hk:#1C150A;--hk2:#33260F;--ln:rgba(224,184,79,.16);--bb:linear-gradient(180deg,#F2D88A,#D2A63E);--bf:#1F1608;--sd:0 1px 2px rgba(0,0,0,.5),0 16px 34px -20px rgba(0,0,0,.9)}
:root[data-t="1"]:not([data-d="1"]){--g:#0D4C3C;--p:#0D4C3C;--t:#10241D;--m:#5E6F66;--bg:#F8F6EC;--hk:#0B3B2E;--hk2:#14604B}
:root[data-t="1"][data-d="1"]{--bg:#07100D;--c:rgba(14,59,46,.45);--g:#1F8A68;--hk:#0B2A21;--hk2:#124536}
:root[data-t="2"]:not([data-d="1"]){--g:#16213E;--p:#16213E;--t:#0F172A;--m:#5F6878;--bg:#F7F6F1;--hk:#111A33;--hk2:#1F2F5C}
:root[data-t="2"][data-d="1"]{--bg:#0A0F1E;--c:rgba(22,33,62,.6);--g:#2A3B6B;--hk:#0E1630;--hk2:#1A2750}
:root[data-t="3"]:not([data-d="1"]){--g:#5B1A2B;--p:#5B1A2B;--t:#2A0F16;--m:#76616A;--bg:#FAF5EF;--hk:#4A1424;--hk2:#7A2339}
:root[data-t="3"][data-d="1"]{--bg:#0E0709;--c:rgba(91,26,43,.42);--g:#8A2D45;--hk:#3A0F1B;--hk2:#5C1C2E}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Hind Siliguri","Noto Serif Bengali",sans-serif;font-size:15px;color:var(--t);background:var(--bg);min-height:100vh;transition:background .4s;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:440px;background:radial-gradient(75% 100% at 50% 0,color-mix(in srgb,var(--a) 14%,transparent),transparent 72%);z-index:-1;pointer-events:none}
button,input,select{font-family:inherit}
h1,h2{font-family:"Noto Serif Bengali",Inter,serif}
main{max-width:1120px;margin:auto;padding:22px 18px 84px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(26px,5vw,32px);margin:0;font-weight:700;letter-spacing:-.3px}
.tools{display:flex;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.wide{grid-column:1/-1}
@media(min-width:960px){.w2{grid-column:span 2}}
.card{background:var(--c);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--sd);position:relative;overflow:hidden}
h2{font-size:15.5px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;letter-spacing:.1px}
.ht{display:flex;align-items:center;gap:10px;min-width:0}
.hi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--k,var(--p));background:color-mix(in srgb,var(--k,var(--a)) 15%,transparent)}
.hi svg,.ic svg{width:17px;height:17px}
/* সেকশনের নিজস্ব সূক্ষ্ম রং: শুধু আইকন-টাইল, কার্ডের মাথার সরু রেখা ও বার — কার্ডের পটভূমি একই থাকে */
:root{--k-edu:#4F6FD8;--k-job:#1B9A8C;--k-don:#CB5C7E;--k-bud:#E07B39;--k-goal:#3FA066;--k-pie:#8B6AD4;--k-tr:#3C95C9;--k-kh:#A8754A;--k-ls:#6B7A8F}
:root[data-d="1"]{--k-edu:#8AA2F5;--k-job:#4FD1C0;--k-don:#F08AA8;--k-bud:#F5A262;--k-goal:#6FD39A;--k-pie:#B79CF5;--k-tr:#6CC0EA;--k-kh:#D9A573;--k-ls:#A9B4C4}
.k-edu{--k:var(--k-edu)}.k-job{--k:var(--k-job)}.k-don{--k:var(--k-don)}.k-bud{--k:var(--k-bud)}.k-goal{--k:var(--k-goal)}.k-pie{--k:var(--k-pie)}.k-tr{--k:var(--k-tr)}.k-kh{--k:var(--k-kh)}.k-ls{--k:var(--k-ls)}
.card:not(.hero)::before{content:"";position:absolute;left:20px;top:0;width:40px;height:3px;border-radius:0 0 4px 4px;background:var(--k,var(--a))}
.ic svg{width:19px;height:19px}
.m{color:var(--m);font-size:13px}
.nm{transition:filter .2s}
.hd .nm{filter:blur(9px);user-select:none}

/* ===== হিরো: ব্যালান্স কার্ড ===== */
.hero{padding:30px 30px 26px;border-radius:26px;color:#F6EDD8;border:1px solid color-mix(in srgb,var(--a2) 42%,transparent);background:linear-gradient(135deg,var(--hk2),var(--hk) 64%);box-shadow:0 34px 60px -34px color-mix(in srgb,var(--hk) 75%,transparent),0 1px 0 rgba(255,255,255,.09) inset;animation:rise .7s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='%23E2C275' stroke-opacity='.17'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/><circle cx='28' cy='28' r='3'/></g></svg>");-webkit-mask-image:linear-gradient(105deg,transparent 38%,#000 100%);mask-image:linear-gradient(105deg,transparent 38%,#000 100%)}
.hero>*{position:relative}
.hero .hl{color:rgba(246,237,216,.7);font-size:13.5px}
.big{display:flex;align-items:baseline;gap:8px;font-family:"Noto Serif Bengali",serif;font-size:clamp(42px,10vw,64px);font-weight:700;letter-spacing:-1px;line-height:1.15;margin:4px 0 18px;color:#FBF1D6}
.big .cur{font-size:.46em;color:var(--a2);font-weight:600;letter-spacing:0}
.split{height:6px;border-radius:6px;background:rgba(127,227,184,.38);overflow:hidden;margin:0 0 20px}
.split i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FFC2B3,#FF8F8F);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sp{font-size:12.5px;color:rgba(246,237,216,.62);margin-bottom:18px}

/* ===== চিপ ===== */
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{padding:10px 15px;border-radius:14px;background:color-mix(in srgb,var(--a) 8%,transparent);border:1px solid var(--ln);font-size:12.5px;color:var(--m);line-height:1.5}
.chip b{display:block;font-size:17px;font-weight:600;color:var(--t);font-family:"Noto Serif Bengali",serif}
.chip.i b{color:var(--ok)}.chip.o b{color:var(--er)}
.hero .chips{gap:0;flex-wrap:wrap;row-gap:10px}
.hero .chip{background:none;border:0;border-radius:0;border-left:1px solid rgba(246,237,216,.18);padding:0 24px;color:rgba(246,237,216,.62)}
.hero .chip:first-child{padding-left:0;border-left:0}
.hero .chip b{font-size:19px;color:#FBF1D6}
.hero .chip.i b{color:#7FE3B8}.hero .chip.o b{color:#FFA3A3}
@media(max-width:480px){.hero{padding:24px 20px 22px}.hero .chip{padding:0 14px}}

/* ===== বাটন ===== */
button{border:1px solid transparent;border-radius:12px;padding:11px 20px;background:var(--bb);color:var(--bf);font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s,background .2s,border-color .2s,color .2s;box-shadow:0 10px 20px -12px color-mix(in srgb,var(--hk) 85%,transparent)}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button.g{background:transparent;color:var(--t);border-color:var(--cb);box-shadow:none;padding:8px 15px;font-size:13px}
button.g:hover{filter:none;background:color-mix(in srgb,var(--a) 11%,transparent)}
.ic{width:42px;height:42px;padding:0;border-radius:13px;display:grid;place-items:center;background:var(--c);color:var(--t);border:1px solid var(--ln);box-shadow:var(--sd);text-decoration:none}
.ic:hover{filter:none;border-color:var(--cb);background:color-mix(in srgb,var(--a) 10%,var(--c))}
.mn{display:flex;align-items:center;gap:4px;background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:3px;box-shadow:var(--sd)}
.mn span{min-width:132px;text-align:center;font-weight:600;font-size:14px}
.mn .ic{border:0;width:36px;height:36px;background:transparent;box-shadow:none;font-size:20px;line-height:1}
.x{background:none;border:0;color:var(--m);padding:4px 8px;box-shadow:none;font-size:15px}
.x:hover{background:none;color:var(--er);filter:none}
.x.ed:hover{color:var(--a)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--t) 5%,transparent);border:1px solid var(--ln)}
.seg button{flex:1;background:transparent;color:var(--m);box-shadow:none;border-radius:10px;padding:8px 10px;font-size:13px}
.seg button:hover:not(.on){filter:none;color:var(--t)}
.seg button.on{background:var(--bb);color:var(--bf);box-shadow:0 8px 16px -10px color-mix(in srgb,var(--hk) 85%,transparent)}

/* ===== ফর্ম ===== */
input,select{width:100%;min-width:0;border:1px solid var(--ln);background-color:color-mix(in srgb,var(--t) 3%,var(--c));color:var(--t);border-radius:12px;padding:11px 13px;font-size:14.5px;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--m);opacity:.75}
input:focus,select:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%238A7A60' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .f2{grid-column:1/-1}
.inl{display:flex;gap:8px;align-items:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.flt{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:6px}
.flt select{width:auto}

/* ===== বার, সতর্কবার্তা, পিল ===== */
.bar{height:8px;border-radius:9px;background:var(--b);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--k,var(--a)),color-mix(in srgb,var(--k,var(--a2)) 55%,#fff));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.hot{background:linear-gradient(90deg,#e08a3a,var(--er))}
.warn,.okb{padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-top:10px}
.warn{background:rgba(220,60,60,.1);border:1px solid rgba(220,60,60,.32);color:var(--er)}
.okb{background:rgba(31,157,107,.1);border:1px solid rgba(31,157,107,.32);color:var(--ok)}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--p);font-weight:600;white-space:nowrap}

/* ===== চার্ট ===== */
.don{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.dw{position:relative;width:156px;height:156px;flex:none}
.dw svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--m);line-height:1.3}
.dc b{font-size:15px;color:var(--t);font-family:"Noto Serif Bengali",serif}
.lg{flex:1 1 150px;display:grid;gap:8px;font-size:13px}
.lg div{display:flex;justify-content:space-between;gap:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.tr{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:158px;padding-top:8px}
.tr>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.tr .bs{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.tr .bs i{width:38%;max-width:18px;border-radius:6px 6px 2px 2px;min-height:2px;transition:height .8s}
.tr .bs i:first-child{background:var(--ok)}.tr .bs i:last-child{background:var(--a)}
.tr small{font-size:11.5px;color:var(--m)}

/* ===== তালিকা ===== */
.row{display:flex;align-items:center;gap:13px;padding:12px 2px;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.ei{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.rt{flex:1;min-width:0}
.rt div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;font-weight:600}
.row>b{font-family:"Noto Serif Bengali",serif;font-weight:600;font-size:15px;white-space:nowrap}
.empty{text-align:center;padding:24px 14px;color:var(--m);font-size:14px;border:1px dashed var(--ln);border-radius:14px}
.pr{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:13.5px}
.pr>span{font-size:18px;width:26px;text-align:center;flex:none}
.pr .pn{flex:1;min-width:0}
.pr .pn>div:first-child{display:flex;justify-content:space-between;gap:8px}
.pr .pb{height:6px;border-radius:6px;background:var(--b);overflow:hidden;margin-top:5px}
.pr .pb i{display:block;height:100%;border-radius:6px}
.th{display:flex;gap:8px}
.th b{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.th b.on{border-color:var(--t)}

/* ===== খাতা সংযোগ ===== */
.lk{color:var(--p);font-weight:700;font-size:13px;text-decoration:none;border-bottom:1px dashed var(--a);white-space:nowrap}
.lk:hover{color:var(--a)}
.kh .kt{margin-bottom:8px}
.kp{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--ln);cursor:pointer;border-radius:12px;transition:background .2s}
.kp:last-of-type{border-bottom:0}
.kp:hover{background:color-mix(in srgb,var(--a) 9%,transparent)}
.kav{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;flex:none;background:linear-gradient(135deg,hsl(var(--h) 45% 38%),hsl(var(--h) 55% 56%))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── প্রিমিয়াম পপআপ (নিশ্চিতকরণ/বার্তা) ── */
.dlg-bd{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:rgba(20,14,4,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:dbd .18s ease-out}
.dlg-bd.out{animation:dbo .14s ease-in forwards}
.dlg{width:100%;max-width:340px;background:var(--bg);border:1px solid var(--cb);border-radius:24px;padding:26px 22px 18px;text-align:center;box-shadow:0 30px 60px -20px rgba(20,14,4,.55);animation:dpop .26s cubic-bezier(.2,.9,.3,1.15)}
.dlg-ic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 14%,transparent);color:var(--a);border:1px solid var(--cb)}
.dlg.dg .dlg-ic{background:color-mix(in srgb,var(--er) 12%,transparent);color:var(--er);border-color:color-mix(in srgb,var(--er) 35%,transparent)}
.dlg-ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dlg h3{margin:0 0 6px;font-size:18px;font-weight:700;color:var(--t)}
.dlg p{margin:0;color:var(--m);font-size:14px;line-height:1.55}
.dlg-b{display:flex;gap:10px;margin-top:22px}
.dlg-b button{flex:1;margin:0;padding:12px 10px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s,filter .15s}
.dlg-b .no{background:transparent;color:var(--t);border:1px solid var(--ln);box-shadow:none}
.dlg-b .ok{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on);border:1px solid var(--cb);box-shadow:0 10px 22px -12px var(--sh)}
.dlg.dg .ok{background:linear-gradient(135deg,#c0392b,#e2574c);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(200,50,40,.7)}
.dlg-b button:active{transform:scale(.97)}
.dlg-b button:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@keyframes dbd{from{opacity:0}to{opacity:1}}
@keyframes dbo{to{opacity:0}}
@keyframes dpop{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
/* ── পুরোনো হিসাব আনা ── */
.dlg.imp{max-width:460px;max-height:90vh;overflow:auto;text-align:left;padding:22px 20px 16px}
.imp-h{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.imp-h .dlg-ic{margin:0;flex:none;width:46px;height:46px}.imp-h .dlg-ic svg{width:22px;height:22px}
.imp-h h3{margin:0 0 2px;font-size:17px}.imp-h p{font-size:12.5px;line-height:1.45}
.imp-ta{width:100%;min-height:130px;border:1px solid var(--ln);border-radius:14px;background:color-mix(in srgb,var(--a) 5%,transparent);color:var(--t);padding:12px;font:inherit;font-size:13px;line-height:1.6;resize:vertical;box-sizing:border-box}
.imp-ta:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 18%,transparent)}
.imp-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px;font-size:12.5px;color:var(--m)}
.imp-t .seg{margin:0;flex:none}
.imp-t .seg button{padding:7px 14px;font-size:12.5px}
.imp-t>button.fl{padding:8px 12px;font-size:12.5px;border-radius:12px;margin-right:auto}
.imp-p{margin-top:10px}
.imp-s{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.imp-s span{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--ln);color:var(--m)}
.imp-s .g1{color:#1f9d6b;border-color:color-mix(in srgb,#1f9d6b 40%,transparent);background:color-mix(in srgb,#1f9d6b 9%,transparent)}
.imp-s .g2{color:var(--er);border-color:color-mix(in srgb,var(--er) 40%,transparent)}
.imp-r{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--ln);font-size:13px;color:var(--t)}
.imp-r small{display:block;color:var(--m);font-size:11.5px}
.imp-r b{white-space:nowrap}.imp-r b.i{color:#1f9d6b}
.imp-e{font-size:12px;color:var(--er);padding:3px 2px}
