const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function calc(d){const r=Math.PI/180,lat=23.8103*r,lon=90.4125,N=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
const B=360/365*(N-81)*r,E=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B),dec=23.45*Math.sin(B)*r;
const noon=12+6-lon/15-E/60;
const ha=a=>Math.acos((Math.sin(a*r)-Math.sin(lat)*Math.sin(dec))/(Math.cos(lat)*Math.cos(dec)))/r/15;
const asr=Math.atan(1/(2+Math.tan(Math.abs(lat-dec))))/r;
return{fajr:noon-ha(-18),sunrise:noon-ha(-.833),noon,asr:noon+ha(asr),maghrib:noon+ha(-.833),isha:noon+ha(-18)}}
const T=h=>{h=((h%24)+24)%24;let m=Math.round(h*60),H=Math.floor(m/60)%24,M=m%60,p=H<12?'ভোর':H<15?'দুপুর':H<17?'বিকাল':H<19?'সন্ধ্যা':'রাত';if(H<4)p='রাত';else if(H<6)p='ভোর';else if(H<12)p='সকাল';return p+' '+bn((H%12||12)+':'+String(M).padStart(2,'0'))};
const dur=h=>{const m=Math.max(1,Math.round(h*60)),H=Math.floor(m/60),M=m%60;return (H?bn(H)+' ঘণ্টা ':'')+(M||!H?bn(M)+' মিনিট':'')};
function render(){const now=new Date(),K=key(now),c=calc(now),cur=now.getHours()+now.getMinutes()/60,night=c.fajr+24-c.maghrib,pd=S.pr[K]||{};
root.dataset.t=S.theme||0;root.dataset.d=S.dark||0;
const W=[['সূর্যোদয়ের সময়',c.sunrise,c.sunrise+.25,'f'],['দ্বিপ্রহর (যাওয়াল)',c.noon-.1,c.noon+.02,'f'],['সূর্যাস্তের সময়',c.maghrib-.25,c.maghrib,'f'],['তাহাজ্জুদ',(c.maghrib+night*2/3)%24,c.fajr,'n'],['ইশরাক',c.sunrise+.25,c.sunrise+1,'n'],['চাশত',c.sunrise+1,c.noon-.15,'n'],['আওয়াবিন',c.maghrib+.2,c.isha,'n']];
const wst=w=>{let a=w[1],b=w[2];if(b<a)b+=24;for(const o of [0,24,-24]){const x=cur+o;if(x>=a&&x<b)return{on:1,left:b-x}}return{on:0,a,in:a>cur?a-cur:a+24-cur}};
const WS=W.map(w=>[w,wst(w)]);
const row=([w,r],chk)=>`<div class="sr ${r.on?'on '+w[3]:''}"><span>${chk!=null?`<input type="checkbox" class="chk" data-i="n${chk}" ${pd['n'+chk]?'checked':''}>`:''}${w[0]}</span><span>${T(w[1])} – ${T(w[2])} · ${r.on?'চলছে · '+dur(r.left)+' বাকি':'শুরু '+dur(r.in)+' পর'}</span></div>`;
const nf=WS.filter(([w])=>w[3]=='n');
const FW=[['ফজর',c.fajr,c.sunrise,'n'],['যোহর',c.noon+.05,c.asr,'n'],['আসর',c.asr,c.maghrib-.25,'n'],['মাগরিব',c.maghrib,c.isha,'n'],['এশা',c.isha,c.fajr+24,'n']];
const fs=FW.map(w=>{const r=wst(w);return{w,r,past:!r.on&&(((w[1]%24)+24)%24)<=cur}});
const fd=FW.filter((_,i)=>pd['f'+i]).length,nd=nf.filter((_,i)=>pd['n'+i]).length;
const fc=k=>{const o=S.pr[k]||{};return [0,1,2,3,4].filter(i=>o['f'+i]).length};
const dd=n=>new Date(now.getFullYear(),now.getMonth(),now.getDate()-n);
let stk=fc(K)==5?1:0;for(let i=1;i<400;i++){if(fc(key(dd(i)))==5)stk++;else break}
const wk=Array.from({length:7},(_,i)=>{const d=dd(6-i);return{d,n:fc(key(d))}}),wsum=wk.reduce((a,x)=>a+x.n,0);
let nxt=null;const bt=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
FW.forEach(w=>{let t=bt+Math.round((((w[1]%24)+24)%24)*60)*6e4;if(t<=now.getTime())t+=864e5;if(!nxt||t<nxt.t)nxt={n:w[0],t}});
const curW=fs.find(x=>x.r.on);
let hj='';try{hj=new Intl.DateTimeFormat('bn-BD-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(now)}catch(e){}
const frow=(x,i)=>{const{w,r,past}=x,dn=!!pd['f'+i];return `<div class="sr ${r.on?'on n':''}"><span><input type="checkbox" class="chk" data-i="f${i}" ${dn?'checked':''} aria-label="${w[0]}">${w[0]}</span><span>${T(w[1])} – ${T(w[2])} · ${dn?'আদায় হয়েছে ✓':r.on?'চলছে · '+dur(r.left)+' বাকি':past?'ওয়াক্ত শেষ':'শুরু '+dur(r.in)+' পর'}</span></div>`};
const hero=`<section class="card hero wide"><div><div class="m">${bn(now.getDate())} ${MON[now.getMonth()]} ${bn(now.getFullYear())}${hj?' · '+hj+' (আনুমানিক)':''}</div><div class="hd">${WFD[now.getDay()]}</div><div class="hn"><span class="m">পরবর্তী ওয়াক্ত · ${nxt.n}</span><b id="nx" data-t="${nxt.t}">${cdf(nxt.t-now.getTime())}</b></div><div class="hcs">${curW?`<span class="pill">এখন চলছে: ${curW.w[0]}</span>`:''}${stk?`<span class="pill">🔥 ${bn(stk)} দিন সব ওয়াক্ত</span>`:''}</div></div><div class="hrs">${mr(fd/5,'var(--a)',bn(fd)+'/'+bn(5),'ফরজ')}${mr(nd/nf.length,'#1f9d6b',bn(nd)+'/'+bn(nf.length),'নফল')}</div></section>`;
const fard=`<section class="card"><h2>ফরজ নামাজ <span class="pill">${bn(fd)}/${bn(5)}</span></h2>${fs.map(frow).join('')}<div class="m" style="margin-top:10px">আদায় করলে টিক দিন</div></section>`;
const ts=S.ts,tasbih=`<section class="card"><h2>তাসবিহ <span class="pill">আজ ${bn(ts.tot[K]||0)}</span></h2><div class="tsw"><button class="tsb" data-a="ts" aria-label="গণনা">${mr(ts.c/ts.t,'var(--a)',bn(ts.c),'/ '+bn(ts.t))}</button></div><div class="chs">${[33,99,100].map(n=>`<button class="opt ${ts.t==n?'on':''}" data-a="tt" data-i="${n}">${bn(n)}</button>`).join('')}<button class="g opt" data-a="tr">↺ রিসেট</button></div></section>`;
const qaza=`<section class="card"><h2>কাযা হিসাব <span class="pill">মোট ${bn(S.qaza.reduce((a,b)=>a+b,0))}</span></h2>${['ফজর','যোহর','আসর','মাগরিব','এশা','বিতর'].map((n,i)=>`<div class="row"><b>${n}</b><span style="display:flex;align-items:center;gap:10px"><button class="g opt" data-a="q" data-i="${i}" data-v="-1" aria-label="কমান">−</button><b style="min-width:34px;text-align:center">${bn(S.qaza[i])}</b><button class="g opt" data-a="q" data-i="${i}" data-v="1" aria-label="বাড়ান">+</button></span></div>`).join('')}<div class="m" style="margin-top:8px">+ বাকি বাড়ায়, − আদায় হিসেবে কমায়</div></section>`;
const week=`<section class="card wide"><h2>এ সপ্তাহের ফরজ <span class="pill">${bn(wsum)}/${bn(35)}</span></h2><div class="wk">${wk.map((x,i)=>`<div class="wc" title="${bn(x.n)}/${bn(5)}"><div class="wv">${x.n?bn(x.n):''}</div><div class="wbw"><i class="wb ${x.n==5?'ok':''} ${i==6?'td':''}" style="height:${x.n/5*100}%"></i></div><div class="wd ${i==6?'on':''}">${i==6?'আজ':WSD[x.d.getDay()]}</div></div>`).join('')}</div><div class="m" style="margin-top:10px;display:flex;gap:6px;align-items:center"><i class="lg"></i>সব ওয়াক্ত আদায়</div></section>`;
$.innerHTML=`<header><div><h1>🕌 নামাজ</h1><div class="sub">ফরজ, নফল ও নিষিদ্ধ সময়ের হিসাব</div></div></header>
<div class="grid">${hero}${fard}<section class="card"><h2>নফল নামাজের সময় <span class="pill">${bn(nd)}/${bn(nf.length)}</span></h2>${nf.map((x,i)=>row(x,i)).join('')}</section>
<section class="card"><h2>নিষিদ্ধ সময়</h2>${WS.filter(([w])=>w[3]=='f').map(x=>row(x)).join('')}<div class="m" style="margin-top:10px">ঢাকার সময় অনুযায়ী (আনুমানিক)</div></section>${tasbih}${qaza}${week}</div>`}
$.addEventListener('change',e=>{const i=e.target.dataset.i;if(!i)return;const K=key(new Date());(S.pr[K]=S.pr[K]||{})[i]=e.target.checked;save();render()});
let lastR='';render();setInterval(()=>{const n=new Date(),m=n.getHours()*60+n.getMinutes();if(m!==lastR&&!typing()){lastR=m;render()}},5000);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,K=key(new Date()),ts=S.ts;
 if(a=='ts'){if(ts.c>=ts.t)ts.c=0;ts.c++;ts.tot[K]=(ts.tot[K]||0)+1;try{navigator.vibrate&&navigator.vibrate(ts.c==ts.t?[40,40,40]:8)}catch(x){}}
 if(a=='tt'){ts.t=i;ts.c=0}
 if(a=='tr')ts.c=0;
 if(a=='q')S.qaza[i]=Math.max(0,S.qaza[i]+ +t.dataset.v);
 save();render()});
setInterval(()=>{const el=document.getElementById('nx');if(!el)return;const ms=+el.dataset.t-Date.now();if(ms<=0){lastR='';render();return}el.textContent=cdf(ms)},1000);
</script></body></html>
