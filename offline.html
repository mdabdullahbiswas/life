<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অফলাইন · Hayat</title>
<style>
:root{--bg:#FBF7EE;--t:#2B2118;--m:#7A6A55;--a:#B8892B;--g:#8A6420;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0C0A07;--t:#F6EDD8;--m:#B3A68B;--a:#E0B84F;--g:#A47A20}}
body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;background:var(--bg);color:var(--t);font-family:"Noto Serif Bengali",Inter,serif;padding:24px}
h1{font-size:26px;margin:0 0 8px;background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--m);margin:0 0 20px}
button{border:1px solid var(--a);background:var(--t);color:var(--a);border-radius:10px;padding:10px 22px;font:inherit;font-weight:600;cursor:pointer}
</style></head><body><main>
<h1>ইন্টারনেট নেই</h1>
<p>এই পেজটি আগে খোলা হয়নি, তাই অফলাইনে নেই।<br>সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
<button onclick="location.reload()">আবার চেষ্টা করুন</button>
</main></body></html>
